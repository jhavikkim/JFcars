name: jfcars

services:
  web:
    build:
      context: .
      target: production
    init: true
    ports:
      - '127.0.0.1:${JFCARS_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_LOG_PATH: /app/.wrangler/logs
      MINIFLARE_REGISTRY_PATH: /app/.wrangler/registry
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      JFCARS_FROM_EMAIL: ${JFCARS_FROM_EMAIL:-}
      JFCARS_REPLY_TO_EMAIL: ${JFCARS_REPLY_TO_EMAIL:-contact@justandfun.com}
      JFCARS_CONTACT_EMAIL: ${JFCARS_CONTACT_EMAIL:-contact@justandfun.com}
      JFCARS_SALES_EMAIL: ${JFCARS_SALES_EMAIL:-sales@justandfun.com}
      JFCARS_ADMIN_EMAIL: ${JFCARS_ADMIN_EMAIL:-jfcars@justandfun.com}
      JFCARS_INFO_EMAIL: ${JFCARS_INFO_EMAIL:-infos@justandfun.com}
      JFCARS_PUBLIC_URL: ${JFCARS_PUBLIC_URL:-https://jfcars.4rbl.com}
    volumes:
      - jfcars_wrangler:/app/.wrangler
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  jfcars_wrangler:
