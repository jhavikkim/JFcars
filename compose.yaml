name: jfcars

services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - '${JFCARS_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      JFCARS_DOCKER: 'true'
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_LOG_PATH: /app/.wrangler/logs
      MINIFLARE_REGISTRY_PATH: /app/.wrangler/registry
    volumes:
      - jfcars_wrangler:/app/.wrangler
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  jfcars_wrangler:
